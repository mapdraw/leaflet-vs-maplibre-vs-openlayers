<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenLayers 9 • GeoJSON Loader</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@v10.9.0/ol.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
        }

        #map {
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>

<body>
    <div id="map"></div>
    <script src="https://cdn.jsdelivr.net/npm/ol@v10.9.0/dist/ol.js"></script>

    <script>
        const map = new ol.Map({
            target: 'map',
            layers: [
                new ol.layer.Tile({
                    source: new ol.source.OSM({
                        attributions: '© OpenStreetMap contributors'
                    })
                })
            ],
            view: new ol.View({
                center: ol.proj.fromLonLat([-96, 38]),
                zoom: 4,
                maxZoom: 19
            })
        });
        fetch('usa_zip_codes_geo_100m.json')
            .then(r => r.json())
            .then(data => {
                const vectorSource = new ol.source.Vector({
                    features: new ol.format.GeoJSON().readFeatures(data, {
                        dataProjection: 'EPSG:4326',
                        featureProjection: 'EPSG:3857'
                    })
                });
                const vectorLayer = new ol.layer.Vector({
                    source: vectorSource,
                });
                map.addLayer(vectorLayer);
            })
            .catch(err => console.error('Error loading GeoJSON:', err));
    </script>
</body>

</html>
