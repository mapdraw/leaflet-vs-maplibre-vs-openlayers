<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>MapLibre GL JS 5.24.0</title>
  <link href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css" rel="stylesheet" />
  <style>* { margin: 0; padding: 0; } #map { width: 100vw; height: 100vh; }</style>
</head>
<body>
  <div id="map"></div>
  <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
  <script>
    const map = new maplibregl.Map({
      container: 'map',
      style: {
        version: 8,
        sources: { osm: { type: 'raster', tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'], tileSize: 256, attribution: '© OpenStreetMap contributors' } },
        layers: [{ id: 'osm', type: 'raster', source: 'osm' }]
      },
      center: [-96, 38],
      zoom: 3
    });
    map.on('load', () => {
      fetch('usa_zip_codes_geo_100m.json')
        .then(r => r.json())
        .then(data => {
          map.addSource('data', { type: 'geojson', data });
          map.addLayer({ id: 'layer-fill', type: 'fill', source: 'data', paint: { 'fill-color': '#3388ff', 'fill-opacity': 0.2 } });
          map.addLayer({ id: 'layer-outline', type: 'line', source: 'data', paint: { 'line-color': '#3388ff', 'line-width': 3 } });
        });
    });
  </script>
</body>
</html>
